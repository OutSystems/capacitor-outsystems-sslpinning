platforms:
  android:
    xml:
      - resFile: xml/network_security_config.xml
        target: network-security-config
        inject: |
          <domain-config>
            <domain includeSubdomains="true">eng-mobile.outsystems.dev</domain>
            <pin-set>
              <pin digest="SHA-256">r/mIkG3eEpVdm+u/ko/cwxzOMo1bk4TyHIlByibiA5E=</pin>
              <pin digest="SHA-256">5kJvNEMw0KjrCAu7eXY5HZdvyCS13BbA0VJG1RSP91w=</pin>
              <pin digest="SHA-256">wBQyMhRmymJ2b9XBo4nHjBqE5KGTT0LUPiNk6rLUSYs=</pin>
              <pin digest="SHA-256">icCZUwzSur5+rZlkCSgVayzDDf0fOJ5ZR8fnlywxjOY=</pin>
            </pin-set>
          </domain-config>

      - resFile: xml/network_security_config.xml
        target: network-security-config
        inject: |
          <domain-config>
            <domain includeSubdomains="true">another-example-host.com</domain>
            <pin-set>
              <pin digest="SHA-256">r/mIkG3eEpVdm+u/ko/cwxzOMo1bk4TyHIlByibiA5E=</pin>
              <pin digest="SHA-256">5kJvNEMw0KjrCAu7eXY5HZdvyCS13BbA0VJG1RSP91w=</pin>
              <pin digest="SHA-256">wBQyMhRmymJ2b9XBo4nHjBqE5KGTT0LUPiNk6rLUSYs=</pin>
              <pin digest="SHA-256">icCZUwzSur5+rZlkCSgVayzDDf0fOJ5ZR8fnlywxjOY=</pin>
            </pin-set>
          </domain-config>

  ios:
    plist:
      - replace: true
        entries:
          - TSKConfiguration:
              TSKSwizzleNetworkDelegates: true
              TSKPinnedDomains:
                  eng-mobile.outsystems.dev:
                      TSKDisableDefaultReportUri: true
                      TSKEnforcePinning: true
                      TSKIncludeSubdomains: false
                      TSKPublicKeyHashes:
                        - r/mIkG3eEpVdm+u/ko/cwxzOMo1bk4TyHIlByibiA5E=
                        - 5kJvNEMw0KjrCAu7eXY5HZdvyCS13BbA0VJG1RSP91w=
                        - wBQyMhRmymJ2b9XBo4nHjBqE5KGTT0LUPiNk6rLUSYs=
                        - icCZUwzSur5+rZlkCSgVayzDDf0fOJ5ZR8fnlywxjOY=
                  another-example-host.com:
                      TSKDisableDefaultReportUri: true
                      TSKEnforcePinning: true
                      TSKIncludeSubdomains: false
                      TSKPublicKeyHashes:
                        - r/mIkG3eEpVdm+u/ko/cwxzOMo1bk4TyHIlByibiA5E=
                        - 5kJvNEMw0KjrCAu7eXY5HZdvyCS13BbA0VJG1RSP91w=
                        - wBQyMhRmymJ2b9XBo4nHjBqE5KGTT0LUPiNk6rLUSYs=
                        - icCZUwzSur5+rZlkCSgVayzDDf0fOJ5ZR8fnlywxjOY=
